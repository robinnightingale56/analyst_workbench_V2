# REVIEW TEMPLATE ONLY: replace server_name and provision approved TLS material.
# TLS here protects transport; it does NOT implement client PKI authentication.
server {
    listen 443 ssl;
    server_name analyst.example.invalid;
    ssl_certificate /etc/analyst/tls/server-chain.pem;
    ssl_certificate_key /etc/analyst/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/analyst/current/artifacts/analyst-workbench/dist/public;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No arbitrary client identity forwarding; a future gateway contract
        # requires separate cryptographic verification and architecture review.
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-Client-DN "";
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Forwarded-Client-Cert "";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}