openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - ClerkSession: []
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Analyst research and assessment operations
  - name: sources
    description: Configured research source adapters
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server liveness, archive policy, and non-secret authentication readiness. Liveness remains OK while PKI is intentionally unready.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Archive policy configuration is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDegraded"
  /auth-mode:
    get:
      security: []
      operationId: getAuthMode
      tags: [health]
      summary: Authentication mode readiness
      description: Returns the non-secret configured authentication mode and whether it is ready to admit protected API traffic.
      responses:
        "200":
          description: Authentication mode and readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthReadiness"
  /analysis-sessions:
    get:
      operationId: listAnalysisSessions
      tags: [analysis]
      summary: List recent analysis sessions
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSession"
    post:
      operationId: createAnalysisSession
      tags: [analysis]
      summary: Create an analyst research session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSession"
  /analysis-sessions/{sessionId}:
    get:
      operationId: getAnalysisSession
      tags: [analysis]
      summary: Get an analysis session and its source files
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Analysis session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAnalysisSessionArchive
      tags: [analysis]
      summary: Archive or restore a non-finalized analysis session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisSessionArchiveUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSession"
        "409":
          description: Session is finalized or was changed by another request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analysis-starters:
    get:
      operationId: listAnalysisStarters
      tags: [analysis]
      summary: List the authenticated analyst's question starters
      description: Recent questions and dated public-source leads from the analyst's own prior research; this is not a current-events feed.
      responses:
        "200":
          description: Authenticated analyst-scoped starters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStarters"
  /current-events:
    get:
      operationId: listCurrentEvents
      tags: [sources]
      summary: Discover verified current events from public RSS providers
      parameters:
        - name: classification
          in: query
          required: false
          schema:
            type: string
            enum: [UNCLASSIFIED, CUI, SECRET, TS]
            default: UNCLASSIFIED
      responses:
        "200":
          description: Current event discovery feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEventFeed"
  /analysis-sessions/{sessionId}/research:
    post:
      operationId: runResearch
      tags: [analysis]
      summary: Run research against selected source adapters
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchRunInput"
      responses:
        "200":
          description: Updated session with generated source files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSession"
  /analysis-sessions/{sessionId}/assessment:
    post:
      operationId: createAssessment
      tags: [analysis]
      summary: Assess selected source files against ICD-203 standards
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "200":
          description: Updated session with ICD-203 assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSession"
    patch:
      operationId: updateIncidentReview
      tags: [analysis]
      summary: Review candidate incidents and finalize the provisional count
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentReviewUpdate"
      responses:
        "200":
          description: Updated session with reviewed incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSession"
        "409":
          description: Review was changed by another request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /source-connectors:
    get:
      operationId: listSourceConnectors
      tags: [sources]
      summary: List configured and available source adapters
      responses:
        "200":
          description: Source connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceConnector"
  /evaluation-vectors:
    get:
      operationId: listEvaluationVectors
      tags: [analysis]
      summary: List the stand-in evaluation vectors used for report grading
      responses:
        "200":
          description: Evaluation vectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluationVectorDefinition"
  /historical-ratings:
    get:
      operationId: listHistoricalRatings
      tags: [analysis]
      summary: List prior-year ratings used for trend comparison
      responses:
        "200":
          description: Historical ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoricalRating"
components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk same-origin browser session cookie used only when AUTH_MODE is clerk. PKI mode is intentionally unready and does not accept this cookie.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        archivePolicy:
          type: object
          additionalProperties: false
          properties:
            retentionDays:
              type: number
            cleanupIntervalMinutes:
              type: number
          required:
            - retentionDays
            - cleanupIntervalMinutes
        authentication:
          $ref: "#/components/schemas/AuthReadiness"
      required:
        - status
        - archivePolicy
        - authentication
    AuthReadiness:
      type: object
      additionalProperties: false
      required: [mode, ready]
      properties:
        mode:
          type: string
          enum: [clerk, pki, invalid]
        ready:
          type: boolean
        reason:
          type: string
          enum: [CLERK_NOT_CONFIGURED, PKI_NOT_CONFIGURED, AUTH_MODE_INVALID]
    HealthDegraded:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          const: Archive policy configuration is invalid
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AnalysisSessionInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 5
          maxLength: 500
        analyst:
          type: string
        classification:
          type: string
          enum: [UNCLASSIFIED, CUI, SECRET, TS]
    AnalysisSessionArchiveUpdate:
      type: object
      required: [archived, expectedVersion]
      properties:
        archived:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
    ResearchRunInput:
      type: object
      required: [sourceConnectorIds]
      properties:
        sourceConnectorIds:
          type: array
          items:
            type: string
        maxResults:
          type: integer
          minimum: 1
          maximum: 20
    AssessmentInput:
      type: object
      required: [selectedSourceFileIds]
      properties:
        selectedSourceFileIds:
          type: array
          items:
            type: string
    IncidentReviewUpdate:
      type: object
      required: [incidents, finalized, expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        finalized:
          type: boolean
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/IncidentReviewInput"
    IncidentReviewInput:
      type: object
      required: [id, date, location, parties, description, sourceFileIds, status]
      properties:
        id:
          type: string
        date:
          type: string
        location:
          type: string
        parties:
          type: array
          minItems: 2
          items:
            type: string
            minLength: 1
        description:
          type: string
        sourceFileIds:
          type: array
          items:
            type: string
        evidenceSpans:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSpan"
        status:
          type: string
          enum: [INCLUDED, EXCLUDED]
    AnalysisSession:
      type: object
      required:
        - id
        - prompt
        - analyst
        - classification
        - status
        - createdAt
        - sourceFiles
        - sourceNotices
        - sourceConnectorIds
        - assessment
        - version
        - updatedAt
        - archivedAt
      properties:
        id:
          type: string
        prompt:
          type: string
        analyst:
          type: string
        classification:
          type: string
          enum: [UNCLASSIFIED, CUI, SECRET, TS]
        status:
          type: string
          enum: [DRAFT, RESEARCHING, READY_FOR_SELECTION, ASSESSING, COMPLETE, FAILED]
        createdAt:
          type: string
        sourceFiles:
          type: array
          items:
            $ref: "#/components/schemas/SourceFile"
        sourceNotices:
          type: array
          items:
            type: string
        sourceConnectorIds:
          type: array
          items:
            type: string
        assessment:
          oneOf:
            - $ref: "#/components/schemas/Assessment"
            - type: "null"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
        archivedAt:
          type: ["string", "null"]
    SourceFile:
      type: object
      required:
        - id
        - title
        - source
        - sourceType
        - publishedAt
        - providerPublishedAt
        - publicationDateSource
        - relevance
        - reliability
        - bluf
        - keyPoints
        - tags
        - url
        - retrievedAt
        - collectionMethod
        - content
        - contentDepth
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
        sourceType:
          type: string
          enum: [NEWS, GOVERNMENT, ACADEMIC, SOCIAL, WEB, INTERNAL]
        publishedAt:
          type: string
        providerPublishedAt:
          type: ["string", "null"]
          description: Authentic publication timestamp parsed from the provider, if available.
        publicationDateSource:
          type: string
          enum: [PROVIDER, RETRIEVAL_FALLBACK, SYNTHETIC, UNKNOWN]
        relevance:
          type: number
          minimum: 0
          maximum: 1
        reliability:
          type: string
          enum: [HIGH, MODERATE, LOW, UNKNOWN]
        bluf:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        url:
          type: string
        retrievedAt:
          type: string
        collectionMethod:
          type: string
        content:
          type: string
        contentDepth:
          type: string
          enum: [FULL_TEXT, EXCERPT, METADATA]
    AnalysisStarters:
      type: object
      required: [recentQuestions, ongoingEvents]
      properties:
        recentQuestions:
          type: array
          items:
            $ref: "#/components/schemas/RecentQuestionStarter"
        ongoingEvents:
          type: array
          items:
            $ref: "#/components/schemas/OngoingEventStarter"
    CurrentEventFeed:
      type: object
      required: [events, providers, checkedAt, freshnessWindowHours, blocked]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/CurrentEvent"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryProviderStatus"
        checkedAt:
          type: string
          format: date-time
        freshnessWindowHours:
          type: number
        blocked:
          type: boolean
    CurrentEvent:
      type: object
      required: [id, title, question, url, provider, publishedAt, retrievedAt, freshness]
      properties:
        id:
          type: string
        title:
          type: string
        question:
          type: string
        url:
          type: string
          format: uri
        provider:
          type: string
        publishedAt:
          type: string
          format: date-time
        retrievedAt:
          type: string
          format: date-time
        freshness:
          type: string
          enum: [CURRENT]
    DiscoveryProviderStatus:
      type: object
      required: [provider, status, message]
      properties:
        provider:
          type: string
        status:
          type: string
          enum: [OK, ERROR, BLOCKED]
        message:
          type: string
    RecentQuestionStarter:
      type: object
      required: [sessionId, prompt, classification, updatedAt]
      properties:
        sessionId:
          type: string
        prompt:
          type: string
        classification:
          type: string
          enum: [UNCLASSIFIED, CUI, SECRET, TS]
        updatedAt:
          type: string
    OngoingEventStarter:
      type: object
      required: [sessionId, title, question, sourceTitle, sourceUrl, publishedAt, retrievedAt]
      properties:
        sessionId:
          type: string
        title:
          type: string
        question:
          type: string
        sourceTitle:
          type: string
        sourceUrl:
          type: string
          format: uri
        publishedAt:
          type: string
        retrievedAt:
          type: string
    SourceConnector:
      type: object
      required: [id, name, description, status, mode, sourceTypes]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [READY, NEEDS_CONFIGURATION, DISABLED]
        mode:
          type: string
          enum: [LIVE, DEMONSTRATION]
        sourceTypes:
          type: array
          items:
            type: string
            enum: [NEWS, GOVERNMENT, ACADEMIC, SOCIAL, WEB, INTERNAL]
    Assessment:
      type: object
      required:
        - id
        - selectedSourceFileIds
        - overallScore
        - standards
        - vectorResults
        - historicalRatings
        - trendAnalysis
        - provisional
        - methodology
        - summary
        - countAnswer
      properties:
        id:
          type: string
        selectedSourceFileIds:
          type: array
          items:
            type: string
        overallScore:
          type: number
          minimum: 0
          maximum: 100
        summary:
          type: string
        standards:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticStandard"
        vectorResults:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationVectorResult"
        historicalRatings:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalRating"
        trendAnalysis:
          $ref: "#/components/schemas/TrendAnalysis"
        provisional:
          type: boolean
        methodology:
          type: string
        countAnswer:
          oneOf:
            - $ref: "#/components/schemas/CountAnswer"
            - type: "null"
    CountAnswer:
      type: object
      required: [question, requestedParties, eventType, dateRange, provisionalCount, confidence, answerStatus, inclusionCriteria, incidents, finalized]
      properties:
        question:
          type: string
        requestedParties:
          type: array
          minItems: 2
          items:
            type: string
            minLength: 1
        eventType:
          type: string
          enum: [PHYSICAL_CLASH]
        dateRange:
          oneOf:
            - $ref: "#/components/schemas/IncidentDateRange"
            - type: "null"
        provisionalCount:
          type: integer
          minimum: 0
        confidence:
          type: string
          enum: [LOW, MODERATE, HIGH]
        answerStatus:
          type: string
          enum: [SUPPORTED, INSUFFICIENT_EVIDENCE]
        inclusionCriteria:
          type: string
        finalized:
          type: boolean
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
    IncidentDateRange:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
        endDate:
          type: string
    Incident:
      type: object
      required: [id, date, location, parties, description, sourceFileIds, status]
      properties:
        id:
          type: string
        date:
          type: string
        location:
          type: string
        parties:
          type: array
          items:
            type: string
            minLength: 1
        description:
          type: string
        sourceFileIds:
          type: array
          items:
            type: string
        evidenceSpans:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSpan"
        status:
          type: string
          enum: [INCLUDED, EXCLUDED]
    EvidenceSpan:
      type: object
      required: [sourceFileId, text, startChar, endChar]
      properties:
        sourceFileId:
          type: string
        text:
          type: string
          minLength: 1
        startChar:
          type: integer
          minimum: 0
        endChar:
          type: integer
          minimum: 0
    AnalyticStandard:
      type: object
      required: [id, name, shortName, score, status, finding, prompt]
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [PASS, REVIEW, GAP]
        finding:
          type: string
        prompt:
          type: string
    EvaluationVectorDefinition:
      type: object
      required: [id, name, description, weight, placeholder]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
        placeholder:
          type: boolean
    EvaluationVectorResult:
      type: object
      required: [id, name, weight, score, status, rationale, evidenceSourceFileIds]
      properties:
        id:
          type: string
        name:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
        score:
          type: number
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [STRONG, MIXED, WEAK]
        rationale:
          type: string
        evidenceSourceFileIds:
          type: array
          items:
            type: string
    HistoricalRating:
      type: object
      required: [year, rating, score, summary, placeholder]
      properties:
        year:
          type: integer
        rating:
          type: string
          enum: [LOW, MODERATE, HIGH, CRITICAL]
        score:
          type: number
          minimum: 0
          maximum: 100
        summary:
          type: string
        placeholder:
          type: boolean
    TrendAnalysis:
      type: object
      required:
        - direction
        - previousRating
        - recommendedRating
        - confidence
        - rationale
        - drivers
      properties:
        direction:
          type: string
          enum: [DOWN, SAME, UP]
        previousRating:
          type: string
          enum: [LOW, MODERATE, HIGH, CRITICAL]
        recommendedRating:
          type: string
          enum: [LOW, MODERATE, HIGH, CRITICAL]
        confidence:
          type: string
          enum: [LOW, MODERATE, HIGH]
        rationale:
          type: string
        drivers:
          type: array
          items:
            type: string
